operations:
  anchor: "From - To"
  columns:
    From: time_range
    Hrs: hours
    Phase: phase_code
    Activity: activity_code
    Productive: productive_code
    NPT: npt
    Rig: rig_status
    MD: md_from_m
    Operation: description
  npt_flag: "Y"
  next_day_separator: '^(?:\*{6,}|_{6,})$'
  footer_pattern: '^\d{2}/\d{2}/\d{4}$'
