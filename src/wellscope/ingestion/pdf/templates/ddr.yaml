# Daily Operation Report (DDR) form, as issued by the operator's reporting system.
# Labels are matched case-insensitively and must be followed by a colon in the form.
# A section title ending in "*" matches by prefix (e.g. "BHA no.# 3").
id: ddr@1
doc_type: DDR
title: Daily Operation Report
signatures: ["Daily Operation Report"]
operator_above_title: true
period: {start_offset_hours: 0, length_hours: 30}
report_number_field: report_number
report_date_field: report_date
well:
  name: well
  wellbore: wellbore
  field: field
  block: block
  region: region
  rig: rig_name

