repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253  # frozen: v0.16.10
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: forbid-api-keys
        name: forbid API keys in tracked files
        language: pygrep
        entry: 'sk-(proj-)?[A-Za-z0-9_\-]{20,}'
        exclude: ^\.pre-commit-config\.yaml$
      - id: forbid-data-files
        name: forbid datasets, parsed output and databases
        language: fail
        entry: Datasets, parsed JSON output and databases must not be committed.
        files: '\.(pdf|docx|db|sqlite3?)$|^data/processed/.+\.json$'
      - id: mypy
        name: mypy (strict)
        language: system
        entry: uv run mypy
        types: [python]
        pass_filenames: false
